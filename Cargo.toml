[workspace]
resolver = "2"
members = []

# Strict lints, per https://www.namtao.com/rust/ — deny panics at compile
# time (a panic unwinding out of a plugin crashes the host DAW). Test code
# is exempted via clippy.toml.
[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
# unchecked_time_subtraction: not yet in stable clippy (unknown-lint warning
# would fail CI under -D warnings); re-add when it stabilizes
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
