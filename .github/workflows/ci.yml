name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fmt, clippy, test
        run: |
          # drop this guard once the workspace has its first crate
          if grep -q '^members = \[\]' Cargo.toml; then echo "no crates yet"; exit 0; fi
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
